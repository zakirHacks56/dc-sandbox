name: gate-poll
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BEACON_LOG: data/log-poll.txt
      SIGNOFF_NAME: ${{ secrets.SIGNOFF_NAME }}
      SIGNOFF_EMAIL: ${{ secrets.SIGNOFF_EMAIL }}
      DISPATCH_TOKEN: ${{ secrets.GH_PAT }}
      DISPATCH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: poll gates
        run: python beacon/gate_poller.py
      - name: commit gate files
        shell: bash
        run: |
          git config --global user.name "oss-relay[bot]"
          git config --global user.email "oss-relay[bot]@users.noreply.github.com"
          git add -A
          git commit -m "gate-poll: $(date -u +%FT%TZ)" --allow-empty || true
          exit_code=1
          for i in 1 2 3 4 5; do
            git config pull.rebase false
            git pull --no-rebase --no-edit -X ours origin master >/dev/null 2>&1 || true
            git add -A
            git commit -m "gate-poll: $(date -u +%FT%TZ)" --allow-empty >/dev/null 2>&1 || true
            if git push >/dev/null 2>&1; then exit_code=0; break; fi
            sleep 6
          done
          exit $exit_code
      - name: wake controller after decree is on master
        shell: bash
        run: |
          if find data/gates -name '*.decree' | grep -q .; then
            python beacon/wake_controller.py
          fi
