name: controller
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "2-59/10 * * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controller
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GITHUB_TOKEN: ${{ secrets.PR_PAT }}
      GH_TOKEN: ${{ secrets.PR_PAT }}
      BEACON_LOG: data/log-control.txt
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
      # W1/W14: direct cloud providers (opt-in). Each becomes a tier in
      # fixer/llm_router.py the moment its secret is set -- omniRoute stays the
      # first provider, these are the failover ladder. Empty means skipped, so
      # a machine without them is byte-for-byte the omniRoute-only path.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      # W9: reserved escalation tier for hard-flagged issues (opt-in).
      COPILOT_API_KEY: ${{ secrets.COPILOT_API_KEY }}
      COPILOT_BASE_URL: ${{ secrets.COPILOT_BASE_URL }}
      COPILOT_MODEL: ${{ secrets.COPILOT_MODEL }}
      # W18: daily token ceiling across all providers (hard safety net).
      GLOBAL_DAILY_TOKEN_BUDGET: ${{ secrets.GLOBAL_DAILY_TOKEN_BUDGET }}
      # Model chain: the fixer defaults to the HARD-CODED OmniRoute auto/* combos
      # (auto/best-coding + auto/best-chat,auto/best-reasoning,auto/best-fast;
      # fast auto/best-chat). That default is correct when OMNIROUTE_BASE_URL
      # points at an omniRoute gateway that resolves auto/* combos. For a cloud
      # base URL that is a plain OpenAI-compatible endpoint (no auto/* aliases),
      # override with CONCRETE model IDs via secrets -- the fixer only honours
      # non-empty values, so an empty/missing secret keeps the auto/* default
      # (the 7f02810e outage was a STALE value silently winning; empty is safe).
      OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
      OMNIROUTE_MODEL_FALLBACKS: ${{ secrets.OMNIROUTE_MODEL_FALLBACKS }}
      OMNIROUTE_FAST_MODEL: ${{ secrets.OMNIROUTE_FAST_MODEL }}
      OMNIROUTE_FAST_MODEL_FALLBACKS: ${{ secrets.OMNIROUTE_FAST_MODEL_FALLBACKS }}
      # Fallback endpoint: an opt-in hosted OpenAI-compatible LLM used when the
      # primary omniRoute gateway is unreachable (e.g. the PC hosting it is off,
      # or the tunnel is down). Leave these empty to keep omniRoute-only behavior
      # (the fixer stays on the local gateway when reachable). When set, the
      # fixer probes the primary endpoint once per run: if it answers, omniRoute
      # is used with its auto/* combos; if not, the cloud run fails over to the
      # fallback model chain (concrete model IDs, since hosted endpoints usually
      # have no auto/* aliases).
      OMNIROUTE_FALLBACK_BASE_URL: ${{ secrets.OMNIROUTE_FALLBACK_BASE_URL }}
      OMNIROUTE_FALLBACK_API_KEY: ${{ secrets.OMNIROUTE_FALLBACK_API_KEY }}
      OMNIROUTE_FALLBACK_MODEL: ${{ secrets.OMNIROUTE_FALLBACK_MODEL }}
      OMNIROUTE_FALLBACK_MODEL_FALLBACKS: ${{ secrets.OMNIROUTE_FALLBACK_MODEL_FALLBACKS }}
      OMNIROUTE_FALLBACK_FAST_MODEL: ${{ secrets.OMNIROUTE_FALLBACK_FAST_MODEL }}
      OMNIROUTE_FALLBACK_FAST_MODEL_FALLBACKS: ${{ secrets.OMNIROUTE_FALLBACK_FAST_MODEL_FALLBACKS }}
      SOLVE_MAX_OUTPUT_TOKENS: "3000"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SIGNOFF_NAME: ${{ secrets.SIGNOFF_NAME }}
      SIGNOFF_EMAIL: ${{ secrets.SIGNOFF_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fixer/requirements.txt
      - name: install fixer dependencies
        run: pip install -q -r fixer/requirements.txt
      - name: poll gates
        run: python beacon/gate_poller.py
      - name: run a tick
        run: python beacon/tick.py
      - name: commit state
        shell: bash
        run: |
          git config --global user.name "oss-relay[bot]"
          git config --global user.email "oss-relay[bot]@users.noreply.github.com"
          git add -A
          git commit -m "controller: $(date -u +%FT%TZ)" --allow-empty || true
          exit_code=1
          for i in 1 2 3 4 5; do
            git config pull.rebase false
            git pull --no-rebase --no-edit -X ours origin master >/dev/null 2>&1 || true
            git add -A
            git commit -m "controller: $(date -u +%FT%TZ)" --allow-empty >/dev/null 2>&1 || true
            if git push >/dev/null 2>&1; then exit_code=0; break; fi
            sleep 6
          done
          exit $exit_code
      - name: notify on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          tok = os.getenv("TELEGRAM_BOT_TOKEN", ""); chat = os.getenv("TELEGRAM_CHAT_ID", "")
          if not (tok and chat): raise SystemExit(0)
          msg = "controller tick FAILED -- machine may be stuck"
          for host in ("api.telegram.org",):
              try:
                  body = json.dumps({"chat_id": chat, "text": msg}).encode()
                  r = urllib.request.urlopen(urllib.request.Request(
                      f"https://{host}/bot{tok}/sendMessage", data=body,
                      headers={"Content-Type": "application/json"}), timeout=20)
                  break
              except Exception:
                  continue
          EOF
  # W17: one daily digest of per-issue failures instead of pinging Telegram on
  # every routine failure. Runs once a day (17:00 UTC) and reads the
  # failures/metrics JSONL the fixer committed during the tick runs.
  digest:
    if: github.event_name == 'schedule' && github.event.schedule == '0 17 * * *' && always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
      - name: daily failure digest
        run: python beacon/digest.py --send
